# Build the documentation site and the signed apt repository, and publish both
# on GitHub Pages (the docs at /, the repository at /apt/).
#
# Triggers: push to main (apt suite "trixie-snapshot" gets the new snapshot
# build) and a call from release.yml (suite "trixie" gets the release build).
# The suite this run does not build is carried over: "trixie" from the latest
# GitHub release, "trixie-snapshot" from the published site. Pull requests are
# only built and checked by the ci workflow (make docs).
#
# Needs, once: Settings > Pages > Source: "GitHub Actions", the secret
# APT_GPG_PRIVATE_KEY (docs/development.md, "The apt repository and its key"), and
# a deployment rule on the github-pages environment that allows main and v* tags.
#
# Site URL: https://bzed.github.io/lokihouse/

name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: "The deb-* artifacts of this run are a release build"
        type: boolean
        default: false
    secrets:
      APT_GPG_PRIVATE_KEY:
        required: true

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_URL: https://bzed.github.io/lokihouse

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install -r docs/requirements.txt
      - run: mkdocs build --strict --site-dir site
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-html
          path: site

  deb:
    # A release run (release.yml) already built the packages.
    if: ${{ !inputs.release }}
    uses: ./.github/workflows/deb.yml
    with:
      snapshot: true

  apt:
    needs: deb
    # deb is skipped in a release run
    if: ${{ !cancelled() && (needs.deb.result == 'success' || needs.deb.result == 'skipped') }}
    runs-on: ubuntu-24.04
    # In a trixie container, like the deb job: the package is built for trixie.
    container: docker.io/library/debian:trixie
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl gh reprepro gnupg
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: deb-*
          merge-multiple: true
          path: built
      - name: Collect the packages of both suites
        run: |
          set -eu
          mkdir -p built
          if [ "${{ inputs.release }}" = true ]; then
            mv built release
            sh scripts/fetch-published-debs.sh "$SITE_URL/apt" trixie-snapshot snapshot
          else
            mv built snapshot
            sh scripts/fetch-release-debs.sh release
          fi
          mkdir -p release snapshot
          ls -l release snapshot
      - name: Build and sign the repository
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          set -eu
          [ -n "$APT_GPG_PRIVATE_KEY" ] || { echo "secret APT_GPG_PRIVATE_KEY is not set" >&2; exit 1; }
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          sh scripts/build-apt-repo.sh apt-repo trixie=release trixie-snapshot=snapshot
          # the key the repository is signed with must be the published one
          gpg --armor --export | diff - apt/lokihouse-archive-keyring.asc
          rm -rf "$GNUPGHOME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apt-repo
          path: apt-repo

  deploy:
    needs: [build, apt]
    # apt depends on deb, which is skipped in a release run, and a skipped
    # ancestor would skip this job too.
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.apt.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-html
          path: site
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apt-repo
          path: site/apt
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
