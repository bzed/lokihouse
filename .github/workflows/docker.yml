# Build and test the container image on both architectures. It is pushed to
# ghcr.io/bzed/lokihouse (linux/amd64 and linux/arm64, signed with cosign, with
# SBOM and provenance) only when release.yml calls this workflow with push: true;
# pushes to main and pull requests build and test it.
name: docker

on:
  push:
    branches: [main]
  pull_request:
    paths: ["Dockerfile", "docker/**", ".dockerignore", "scripts/docker-test.sh", "go.mod", "go.sum", ".github/workflows/docker.yml"]
  workflow_call:
    inputs:
      push:
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/bzed/lokihouse

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image and test it on this architecture
        run: |
          set -eu
          if [ "${{ github.ref_type }}" = tag ]; then v=${GITHUB_REF_NAME#v}; else v=$(git describe --tags --always | sed 's/^v//'); fi
          docker buildx build --load -t localhost/lokihouse:test \
            --build-arg VERSION="$v" --build-arg REVISION="$(git rev-parse --short=12 HEAD)" \
            --build-arg BRANCH="$GITHUB_REF_NAME" \
            --build-arg BUILD_DATE="$(date -u -d "@$(git log -1 --format=%ct)" +%Y-%m-%dT%H:%M:%SZ)" .
          ENGINE=docker sh scripts/docker-test.sh localhost/lokihouse:test

  publish:
    if: ${{ inputs.push }}
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signature
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Build arguments
        run: |
          {
            echo "REVISION=$(git rev-parse --short=12 HEAD)"
            echo "BUILD_DATE=$(date -u -d "@$(git log -1 --format=%ct)" +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_ENV"
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ env.REVISION }}
            BRANCH=${{ github.ref_name }}
            BUILD_DATE=${{ env.BUILD_DATE }}
      - name: Sign the image
        run: cosign sign --yes "$IMAGE@${{ steps.build.outputs.digest }}"
