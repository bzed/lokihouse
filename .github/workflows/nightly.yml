name: nightly
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cluster:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make test-cluster
  oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    services:
      clickhouse:
        image: docker.io/clickhouse/clickhouse-server:26.9
        env:
          CLICKHOUSE_SKIP_USER_SETUP: "1"
        ports: ["9000:9000"]
        options: >-
          --ulimit nofile=262144:262144
          --health-cmd "clickhouse-client -q 'SELECT 1'"
          --health-interval 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: test/oracle/.cache
          key: loki-${{ hashFiles('Makefile') }}
      - run: make oracle-all
  oracle-cluster:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: test/oracle/.cache
          key: loki-${{ hashFiles('Makefile') }}
      - run: make oracle-cluster
  soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      clickhouse:
        image: docker.io/clickhouse/clickhouse-server:26.9
        env:
          CLICKHOUSE_SKIP_USER_SETUP: "1"
        ports: ["9000:9000"]
        options: >-
          --ulimit nofile=262144:262144
          --health-cmd "clickhouse-client -q 'SELECT 1'"
          --health-interval 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: LOKIHOUSE_SOAK_DURATION=30m make soak
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: soak-profiles
          path: .cache/soak/
