# mkdocs configuration for the lokihouse documentation site.
#
# The site is a stable "current" set of pages. The canonical divergences list
# (docs/divergences.md) lives in the repo and is linked to from the site, not
# duplicated on it.
#
# CI (see .github/workflows/docs.yml) runs `mkdocs build --strict` and
# deploys to GitHub Pages and mirrors the site to https://lokihouse.dev/.
#
# NOTE: before the first deploy, the repo's Pages setting must be configured:
#   Settings → Pages → Source: "GitHub Actions" (branch: main)

site_name: lokihouse
site_description: lokihouse is a Grafana Loki-compatible log server. It speaks Loki's HTTP API and LogQL and stores and queries the logs in ClickHouse.
site_url: https://lokihouse.dev/
site_author: Bernd Zeimetz

repo_name: bzed/lokihouse
repo_url: https://github.com/bzed/lokihouse

theme:
  name: material
  custom_dir: docs/overrides
  # no Google Fonts: faster pages, no third-party requests
  font: false
  logo: assets/logo-icon.svg
  favicon: assets/logo-icon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: pink
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: pink
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bzed/lokihouse
      name: lokihouse on GitHub

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

strict: true

# External links are not validated by mkdocs' link validator (it only
# checks internal links); this keeps transient network failures on the CI
# runner from blocking a publish. Broken *internal* links still fail the
# strict build.

docs_dir: docs

# The repo's docs/ folder also holds files that are not part of the public
# site: the canonical divergences list, the design spec and the implementation
# plans (docs/superpowers/), the man page source and the pip requirements of the
# docs build. The site links to them via absolute GitHub URLs. exclude_docs keeps
# them out of the published site without moving them out of docs/.
exclude_docs: |
  /divergences.md
  /superpowers/
  /overrides/
  /man/
  /requirements.txt

nav:
  - Home: index.md
  - Installation: install/index.md
  - Operations: operations.md
  - Benchmark: benchmark.md
  - Migrating from Loki: migrating.md
  - Roadmap: roadmap.md
  - Reference:
      - Configuration: reference/configuration.md
      - HTTP API: reference/http-api.md
      - Divergences: reference/divergences.md
  - Development: development.md
  - About: about.md
