<!-- Source of social-card.png (1200x630): inkscape docs/assets/social-card.svg -w 1200 -o docs/assets/social-card.png -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d1b3a"/>
      <stop offset="1" stop-color="#2d1f5e"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5d73"/>
      <stop offset="1" stop-color="#ff8a5c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect y="618" width="1200" height="12" fill="url(#bar)"/>
  <image x="90" y="145" width="340" height="340" xlink:href="logo.svg"/>
  <g font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#e9e6ff">
    <text x="480" y="270" font-size="112" font-weight="700">lokihouse</text>
    <text x="484" y="350" font-size="38" fill="#ffd166">Grafana Loki's HTTP API,</text>
    <text x="484" y="400" font-size="38" fill="#ffd166">with logs stored in ClickHouse.</text>
    <text x="484" y="490" font-size="28" opacity="0.85">One Go binary · same LogQL · lokihouse.dev</text>
  </g>
</svg>
