auth_enabled: false
server:
  http_listen_port: 3100
  # http_listen_address: 0.0.0.0
  # log_level: info                # debug | info | warn | error
  # log_format: logfmt             # logfmt | json
  # http_server_read_timeout: 30s
  # http_server_write_timeout: 30s # long queries need more (query_timeout is 1m)
  # http_server_idle_timeout: 120s
  # graceful_shutdown_timeout: 30s
clickhouse:
  addr: ["localhost:9000"]
  database: lokihouse
  username: default
  # password_file: /run/credentials/lokihouse.service/lokihouse.clickhouse-password
  # ClickHouse cluster (remote_servers name). Tables become Replicated*MergeTree
  # <table>_local created ON CLUSTER, plus Distributed tables; list several nodes in addr.
  # cluster: lokihouse
  # replicated: true              # false = sharding without replication
  # replica_path: /clickhouse/tables/{shard}/{database}/{table}   # default: server default_replica_path
  # replica_name: '{replica}'
  # settings: {insert_quorum: 2}  # any ClickHouse session setting
limits_config: {}
# Loki's ruler (alerting and recording rules), with Loki's own config keys.
# It runs only when ruler_storage is set, and on one lokihouse instance only
# (no ruler ring; see docs/divergences.md).
# ruler:
#   rule_path: /var/lib/lokihouse/rules-temp   # default: rules-temp (relative)
#   alertmanager_url: http://alertmanager:9093
#   external_url: http://grafana:3000
#   remote_write:
#     enabled: true
#     clients:
#       prom: {url: http://prometheus:9090/api/v1/write}
#   wal: {dir: /var/lib/lokihouse/ruler-wal}   # wiped at every start
# ruler_storage:
#   backend: filesystem                        # local = read-only rule files
#   filesystem: {dir: /var/lib/lokihouse/rules}
